[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepecohab-acquisition"
dynamic = ["version"]
description = "Modular DeepEcoHAB multi-device acquisition application"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Marcin-A-Lipiec"}]
keywords = ["deepecohab", "ecohab", "rfid", "acquisition", "neuroscience"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "PySide6>=6.6,<7",
  "pyserial>=3.5",
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.8,<4.12",
  "tzdata>=2024.1",
  "pyarrow>=15,<22",
  "platformdirs>=4,<5",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/Marcin-A-Lipiec/deepecohab-acquisition"
Issues = "https://github.com/Marcin-A-Lipiec/deepecohab-acquisition/issues"
Documentation = "https://github.com/Marcin-A-Lipiec/deepecohab-acquisition#readme"
Changelog = "https://github.com/Marcin-A-Lipiec/deepecohab-acquisition/blob/main/CHANGELOG.md"

[project.scripts]
acquisition-gui = "deepecohab_recorder.app:main"
deepecohab-recorder = "deepecohab_recorder.app:main"
deepecohab-acquisition-cli = "deepecohab_recorder.cli:main"
deepecohab-acquisition-shortcut = "deepecohab_recorder.desktop:main"
deepecohab-verify-video = "deepecohab_recorder.maintenance.verify_video:main"
deepecohab-recover-serial = "deepecohab_recorder.maintenance.recover_serial:main"

[project.gui-scripts]
deepecohab-acquisition = "deepecohab_recorder.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4.18,<5", "polars>=1,<3", "build>=1.2,<2"]

[tool.setuptools.dynamic]
version = {attr = "deepecohab_recorder.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["deepecohab_recorder*"]

[tool.setuptools.package-data]
deepecohab_recorder = ["assets/*.svg", "assets/*.ico", "assets/*.json", "assets/*.qss",
  "assets/licenses/*.txt", "assets/help/*.md", "assets/fonts/*.ttf", "assets/icons/*.svg", "assets/theme/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".artifacts/pytest-cache"
